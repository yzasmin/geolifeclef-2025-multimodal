seed: 42

data:
  data_root: ./data
  cache_dir: .cache
  num_workers: 2
  spatial_grid_size: 1.0
  min_species_per_sample: 1
  max_species_per_sample: 50

model:
  embed_dim: 256
  attn_heads: 4
  dropout: 0.1
  patch_encoder:
    channels: [32, 64, 128]
    token_dim: 128
  temporal_encoder:
    hidden_dim: 128
    kernel_size: 5
    num_layers: 3
    bioclim_num_vars: 4
  tabular_encoder:
    hidden_dims: [256, 128]
    dropout: 0.1

training:
  batch_size: 64
  epochs: 8
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  patience: 2
  folds: 5
  gamma_pos: 0.0
  gamma_neg: 2.0
  loss_clip: 0.05
  set_size_weight: 0.2
  max_train_samples: 300000
  max_val_samples: 50000

pseudo_label:
  t_pos: 0.5
  t_neg: 0.03
  max_negatives_per_sample: 64
  batch_size: 256

sampling:
  enabled: true
  pa_po_ratio: 2.0
  min_weight: 0.2
  max_weight: 5.0

inference:
  default_threshold: 0.2
  set_size_alpha: 1.0
  max_k_calibrated_fallback: 30

output:
  artifacts_dir: artifacts
  log_interval: 50
